<style>
:root{
  --bg:#fff;--card:#fff;--ink:#24324a;--muted:#6c7b90;--line:#dceaf6;
  --blue:#3b82f6;--blue-soft:#eef6ff;--green:#22a06b;--green-soft:#eaf9f2;

}
*{box-sizing:border-box}
html{background:#fff;color-scheme:light}

.wrap{max-width:1040px;margin:auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0 2px}
.brand{display:flex;align-items:center;gap:12px}.badge36{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#60a5fa,#8b5cf6);color:#fff;display:grid;place-items:center;font-size:1.35rem;font-weight:900;box-shadow:var(--shadow)}
h1{font-size:clamp(1.15rem,2.4vw,1.55rem);margin:0;line-height:1.3}.subhead{font-size:.84rem;color:var(--muted);font-weight:600;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:700 1rem var(--jp);border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 4px 0 #216ad4;touch-action:manipulation;transition:transform .08s ease,filter .15s ease}
button:hover{filter:brightness(1.03)}button:active{transform:translateY(2px);box-shadow:0 2px 0 #216ad4}button:disabled{cursor:default;opacity:.62;box-shadow:none;transform:none}
button.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}button.small{padding:9px 13px;font-size:.88rem}.danger{color:var(--red)!important}.okbtn{background:var(--green);box-shadow:0 4px 0 #14764d}.orange{background:var(--orange);box-shadow:0 4px 0 #d97816}
main{display:flex;flex-direction:column;gap:16px}.card{background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:clamp(18px,3vw,30px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}.hero{background:linear-gradient(135deg,#f4f9ff 0%,#fff 58%,#f7f2ff 100%);border-color:#cfe4fb}.hero h2{font-size:clamp(1.45rem,3vw,2.1rem);margin:0;line-height:1.35}.hero p{margin:0;color:var(--muted)}
.flow{display:flex;gap:7px;flex-wrap:wrap}.flow span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:800}.flow .hot{background:#fff7df;border-color:#ffd979;color:#7a5412}
.section-title{display:flex;align-items:center;gap:8px;font-size:1.13rem;font-weight:900;margin:8px 2px 0}.dot{width:12px;height:12px;border-radius:50%;background:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{position:relative;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 #e7f0f7;padding:17px 15px;border-radius:17px;min-height:122px;display:flex;flex-direction:column;gap:5px}.tile:active{box-shadow:0 2px 0 #e7f0f7}.tile .ico{font-size:1.65rem}.tile .t{font-weight:900;font-size:1rem;line-height:1.35;padding-right:36px}.tile .p{color:var(--muted);font-size:.8rem;line-height:1.45}.tile .st{position:absolute;right:11px;top:10px;font-size:.78rem;font-weight:900}.tile.done{border-color:#a7e3c7;background:#f6fffa}.tile.done .st{color:var(--green)}.tile.missed{border-color:#ffc3c3}.tile.missed .st{color:var(--red)}
.prog{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-weight:800}.bar{height:10px;flex:1;border-radius:999px;background:#edf3f8;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#34d399);border-radius:999px;transition:width .25s ease}.prog b{color:var(--ink)}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.step{font-size:.8rem;font-weight:900;color:#3568a7;background:var(--blue-soft);padding:5px 10px;border-radius:999px}.prompt{font-weight:900;font-size:clamp(1.12rem,2.6vw,1.45rem);line-height:1.55}.en{font-family:var(--en);font-size:clamp(1.2rem,2.8vw,1.55rem);line-height:1.65}.jp{font-size:1.04rem}.note{color:var(--muted);font-size:.9rem}.tip{background:#fff9db;border:2px solid #ffe27a;border-radius:14px;padding:12px 14px;font-size:.92rem}.pattern{font-family:var(--en);font-size:clamp(1.2rem,2.5vw,1.55rem);font-weight:700;background:#f5f9ff;border:2px solid #cfe4fb;padding:12px 14px;border-radius:14px}.arrowline{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.arrowline .box{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;min-height:62px}.arrowline .arr{font-size:1.6rem;color:var(--blue);font-weight:900}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 #e8f0f7;text-align:left;padding:14px;border-radius:14px;line-height:1.5}.opt.en{font:700 1.07rem var(--en)}.opt.ok{background:var(--green-soft);border-color:#80d4aa}.opt.ng{background:var(--red-soft);border-color:#ffaeae;color:#8d5151;text-decoration:line-through}.feedback{border-radius:16px;padding:14px 16px;font-weight:800;display:flex;gap:10px;align-items:flex-start}.feedback.ok{background:var(--green-soft);border:2px solid #9cddbd;color:#166b47}.feedback.ng{background:var(--red-soft);border:2px solid #ffc0c0;color:#9a3434}.feedback .face{font-size:1.5rem}.actions{display:flex;gap:10px;flex-wrap:wrap}
.bank,.answerline{display:flex;gap:9px;flex-wrap:wrap;min-height:54px;align-items:center}.answerline{border:2px dashed #bcd5e8;border-radius:15px;padding:10px;background:#f9fcff}.chip{background:#fff!important;color:var(--ink)!important;border:2px solid #a8c8e1!important;box-shadow:0 3px 0 #dcecf7!important;border-radius:12px!important;padding:9px 12px!important;font-family:var(--en)!important;font-size:1.03rem!important}.chip.jpchip{font-family:var(--jp)!important}.chip.placed{background:#eef7ff!important}.placeholder{color:var(--muted);font-size:.86rem}.inputrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.textin{font:600 1.08rem var(--en);border:2px solid #b9d2e6;border-radius:12px;padding:11px 13px;min-width:120px;max-width:100%;color:var(--ink);background:#fff}.textin:focus{outline:3px solid #cfe4ff;border-color:var(--blue)}textarea.textin{width:100%;height:104px;resize:vertical}.hintbox{border-left:5px solid #8b5cf6;background:#faf7ff;padding:11px 13px;border-radius:10px;font-size:.92rem}.muted{color:var(--muted)}.writehelp{display:flex;flex-direction:column;gap:8px;background:#f7fbff;border:2px solid #cfe4ff;border-radius:14px;padding:12px 14px}.attempts{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:#fff3cd;border:2px solid #ffd45c;border-radius:999px;padding:5px 11px;font-weight:800;font-size:.9rem}.hintstep{background:#fff;border:1px solid #d7e6f2;border-radius:10px;padding:9px 11px}.hintstep b{color:#2563eb}.answerreveal{background:#eaf8ee;border:2px solid #7ac89a;border-radius:14px;padding:12px 14px}.answerreveal .en{font-size:1.14rem;font-weight:800}.skeleton{font-family:var(--en);font-size:1.08rem;font-weight:700;background:#fff;border:2px dashed #9cc7e8;border-radius:12px;padding:10px 12px}
.timer{display:inline-flex;align-items:center;gap:8px;background:#fff7df;border:2px solid #ffd369;border-radius:999px;padding:7px 12px;font-weight:900;color:#79520c}.timer.urgent{background:#fff0f0;border-color:#ffb0b0;color:#a33}.fastclear{text-align:center;background:linear-gradient(135deg,#ecfff5,#f8ffec);border-color:#a5e2bd}.fastclear .bolt{font-size:3.2rem}.fastclear h2{margin:0;font-size:1.7rem;color:#168052}.spark{animation:pop .4s ease both}@keyframes pop{from{transform:scale(.75);opacity:.2}to{transform:scale(1);opacity:1}}
/* auto visual */
.visual{border:2px solid #d4e7f6;background:#fbfdff;border-radius:18px;padding:15px;overflow:hidden}.scene{min-height:190px;position:relative;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}.bubble{max-width:330px;background:#fff;border:3px solid #8dbce0;border-radius:22px;padding:14px 17px;position:relative;font-family:var(--en);font-size:1.08rem;box-shadow:0 5px 0 #e1eff9}.bubble:after{content:"";position:absolute;bottom:-14px;left:38px;border:8px solid transparent;border-top-color:#8dbce0}.person{font-size:3.2rem}.transform{display:flex;flex-direction:column;align-items:center;gap:6px}.bigarr{font-size:2rem;color:var(--blue);animation:nudge 1.15s ease-in-out infinite alternate}.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.morph{padding:7px 10px;border-radius:10px;background:#fff3b8;border:2px solid #f2cf54;font-weight:900;animation:glow 2.4s ease-in-out infinite}.morph:nth-child(2){animation-delay:.3s}.morph:nth-child(3){animation-delay:.6s}.morph:nth-child(4){animation-delay:.9s}.reportbox{max-width:410px;background:#effaf5;border:3px solid #88d5b1;border-radius:16px;padding:13px 15px;font-family:var(--en);font-size:1.06rem;font-weight:700}@keyframes nudge{to{transform:translateX(8px)}}@keyframes glow{0%,100%{transform:translateY(0);background:#fff3b8}50%{transform:translateY(-5px);background:#ffdf69}}
.mapgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.mapitem{border:2px solid var(--line);border-radius:12px;padding:9px 8px;text-align:center;background:#fff}.mapitem b{font-family:var(--en);color:#235f9e}.mapitem span{display:block;color:var(--muted);font-size:.78rem}.mapitem i{display:block;color:var(--blue);font-style:normal;font-weight:900}.mapitem.pulse{animation:mapPulse 2.7s ease-in-out infinite}.mapitem:nth-child(2n){animation-delay:.45s}@keyframes mapPulse{0%,100%{border-color:var(--line);transform:scale(1)}50%{border-color:#7cb9ed;transform:scale(1.025)}}
.summary-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.sumitem{border:2px solid var(--line);border-radius:14px;padding:11px 12px}.sumitem b{display:block;color:#245a94}.sumitem .ex{font:600 .97rem var(--en);margin-top:4px}.tiny{font-size:.79rem;color:var(--muted)}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.mapgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{max-width:760px}.opts{grid-template-columns:1fr}.arrowline{grid-template-columns:1fr}.arrowline .arr{transform:rotate(90deg);text-align:center}.summary-list{grid-template-columns:1fr}}
@media(max-width:520px){body{padding:12px 12px 48px}.badge36{width:46px;height:46px}.tiles{grid-template-columns:1fr}.card{padding:17px 14px;border-radius:15px}.scene{min-height:160px;gap:10px}.bubble,.reportbox{font-size:.96rem}.person{font-size:2.6rem}.mapgrid{grid-template-columns:1fr 1fr}button{width:100%}.tools button{width:auto}.actions button{flex:1}.inputrow .textin{width:100%}.tile{min-height:105px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* --- Lesson 36 v3: concept mini-animation + easy "still true" illustration --- */
.storyvideo{border:2px solid #cfe4fb;background:linear-gradient(180deg,#f7fbff,#fff);border-radius:20px;padding:16px;overflow:hidden}
.storytitle{font-weight:900;color:#2563eb;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.storytrack{position:relative;min-height:285px;border-radius:16px;background:#fff;overflow:hidden;border:2px solid #e6f0f8}
.storyphase{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;opacity:0}
.storyphase .people{display:flex;align-items:flex-end;justify-content:center;gap:24px;min-height:92px}
.storyphase .actor{font-size:4.3rem;filter:drop-shadow(0 5px 6px rgba(40,72,110,.12))}
.storyphase .who{font-weight:900;font-size:.9rem;color:var(--muted)}
.storybubble{position:relative;max-width:480px;background:#fff;border:3px solid #6ba9dc;border-radius:24px;padding:12px 17px;font:700 1.2rem var(--en);box-shadow:0 5px 0 #e3f0fa}
.storybubble:after{content:"";position:absolute;left:34px;bottom:-15px;border:8px solid transparent;border-top-color:#6ba9dc}
.storyjp{font-size:1rem;font-weight:800;background:#fff8d8;border:2px solid #ffe184;border-radius:12px;padding:8px 12px}
.storyarrow{font-size:2.1rem;color:#3b82f6;font-weight:900}
.storyreport{max-width:520px;background:#eaf9f2;border:3px solid #8bd7b2;border-radius:16px;padding:12px 15px;font:700 1.15rem var(--en);box-shadow:0 5px 0 #def1e7}
.storyphase.one{animation:storyOne 8s ease-in-out infinite}
.storyphase.bridge{animation:storyBridge 8s ease-in-out infinite}
.storyphase.two{animation:storyTwo 8s ease-in-out infinite}
@keyframes storyOne{0%,4%{opacity:0;transform:translateY(8px)}8%,34%{opacity:1;transform:translateY(0)}40%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes storyBridge{0%,34%{opacity:0;transform:scale(.92)}40%,49%{opacity:1;transform:scale(1)}54%,100%{opacity:0;transform:scale(.92)}}
@keyframes storyTwo{0%,50%{opacity:0;transform:translateY(8px)}56%,94%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
.storylegend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.storylegend>div{border-radius:12px;padding:9px 11px;font-size:.9rem;font-weight:800}
.storylegend .direct{background:#eef6ff;border:2px solid #cfe4fb}.storylegend .indirect{background:#eaf9f2;border:2px solid #bce8d2}
.truthscene{display:grid;grid-template-columns:minmax(220px,1fr) minmax(250px,1.2fr);gap:16px;align-items:center;border:2px solid #d9e9f7;background:#fbfdff;border-radius:18px;padding:16px}
.orbitbox{position:relative;height:210px;border-radius:18px;background:linear-gradient(#dff2ff 0 62%,#f6fbff 62%);overflow:hidden;border:2px solid #cae3f5}
.sunbig{position:absolute;left:28px;top:28px;font-size:4.2rem;filter:drop-shadow(0 0 12px #ffd45c)}
.orbit{position:absolute;left:92px;top:38px;width:125px;height:125px;border:3px dashed #8bb9dc;border-radius:50%;animation:spin 7s linear infinite}
.earth{position:absolute;right:-18px;top:46px;font-size:2.3rem;transform:rotate(0deg)}
.easttag{position:absolute;right:12px;bottom:12px;background:#fff;border:2px solid #f4c84c;border-radius:999px;padding:5px 9px;font-size:.8rem;font-weight:900}
@keyframes spin{to{transform:rotate(360deg)}}
.truthwords{display:flex;flex-direction:column;gap:9px}.truthwords h3{margin:0;color:#1f6f4a;font-size:1.2rem}.truthsimple{background:#fff8d8;border:2px solid #ffe184;border-radius:13px;padding:10px 12px;font-weight:900}.truthen{font:700 1.08rem var(--en);background:#fff;border:2px solid #bde4cf;border-radius:13px;padding:10px 12px}.truthkeep{display:inline-flex;align-items:center;gap:7px;background:#eaf9f2;border:2px solid #9bdbbc;color:#166b47;border-radius:999px;padding:7px 11px;font-weight:900;align-self:flex-start}
@media(max-width:640px){.storytrack{min-height:310px}.storyphase .actor{font-size:3.7rem}.storybubble,.storyreport{font-size:1.05rem}.storylegend{grid-template-columns:1fr}.truthscene{grid-template-columns:1fr}.orbitbox{height:185px}}
@media(prefers-reduced-motion:reduce){.storyphase.one,.storyphase.bridge,.storyphase.two,.orbit{animation-duration:.01ms!important;animation-iteration-count:1!important}.storyphase.one{opacity:1!important;position:relative}.storyphase.bridge,.storyphase.two{display:none}}


.companion{display:flex;align-items:center;gap:18px;padding:18px;border:2px solid #efdccc;border-radius:22px;background:#fffaf3}
.buddy-art{width:112px;height:112px;border-radius:26px;display:block;animation:breathe 3s ease-in-out infinite}
.buddy-art.happy{animation:celebrate .55s ease 3}.buddy-art.think{animation:ponder .8s ease 2}
.buddy-copy{flex:1;min-width:0}.buddy-name{font-size:.8rem;color:#98664b;font-weight:800}.buddy-speech{font-weight:800;margin:5px 0 12px;line-height:1.6}
.buddy-actions{display:flex;gap:8px;flex-wrap:wrap}.visit-stats{display:flex;gap:8px;flex-wrap:wrap}.visit-stats span{background:#f0f7ee;border:1px solid #cfe2c8;padding:5px 12px;border-radius:30px;font-size:.86rem;font-weight:800}
.tile.done{border:3px solid #22a06b!important;background:#effbf4!important}.tile.done .st{background:#15764c;color:white;padding:5px 12px;border-radius:30px;font-weight:900}.save-note{font-size:.78rem;color:var(--muted)}
@keyframes breathe{50%{transform:translateY(-5px) rotate(2deg)}}@keyframes celebrate{35%{transform:translateY(-17px) rotate(-9deg)}70%{transform:translateY(-7px) rotate(9deg)}}@keyframes ponder{30%{transform:rotate(-7deg)}70%{transform:rotate(7deg)}}
@media(max-width:540px){.companion{padding:12px;gap:12px}.buddy-art{width:80px;height:80px}.buddy-speech{font-size:.9rem}.buddy-actions button{font-size:.78rem;padding:8px}.visit-stats span{font-size:.76rem}}
@media(prefers-reduced-motion:reduce){.buddy-art,.buddy-art.happy,.buddy-art.think{animation:none}}

.toritsu-box{border:2px solid #c7d9ed;background:#f5f9ff;border-radius:18px;padding:16px;display:grid;gap:12px;margin-top:16px}
.toritsu-box h2{font-size:1.05rem;margin:0}.toritsu-box p{margin:0;font-size:.88rem}.toritsu-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toritsu-controls select{font:inherit;padding:9px;border:1px solid #aec7e3;border-radius:10px;background:white;max-width:100%}.toritsu-question{width:100%;min-height:65px;font:inherit;padding:10px;border:1px solid #aec7e3;border-radius:10px}.toritsu-preview{width:100%;height:210px;font:14px/1.7 var(--jp);padding:12px;border:1px solid #aec7e3;border-radius:10px;background:white;resize:vertical}.toritsu-open{display:inline-block;padding:10px 15px;border-radius:12px;background:#245da8;color:white;font-weight:800;text-decoration:none}.toritsu-status{font-size:.85rem;color:#225c47}.toritsu-box summary{cursor:pointer;font-size:.9rem;font-weight:700}

.toritsu-box{border:0;border-radius:0;background:transparent;margin:0;padding:0 0 12px;gap:8px}
.toritsu-box p,.toritsu-box summary,.toritsu-status{font-size:.76rem}
.toritsu-controls{gap:6px}.toritsu-controls select{padding:6px;font-size:.8rem}
.toritsu-question{min-height:48px;padding:8px;font-size:.8rem}
.toritsu-box button,.toritsu-open{font-size:.8rem;padding:8px 10px;border-radius:9px}
.toritsu-preview{height:150px;font-size:.78rem}.answer-status{display:grid;gap:12px}
.answer-status:empty{display:none}.answer-status>button{justify-self:start}

<div class="login-card"><div class="login-mark" aria-hidden="true">🍅</div><h1>Lesson 36　話法</h1><p>パスワードを入れて、学習を始めよう！</p>

  <div class="brand"><div class="badge36">36</div><div><h1>Lesson 36　話法</h1><div class="subhead">直接話法 ⇄ 間接話法　練習帳</div></div></div>

<script>
function initializeLesson(){
'use strict';
var app=document.getElementById('app'),home=document.getElementById('home'),soundBtn=document.getElementById('sound');
var STORE='lesson36-progress-v1',SOUND='lesson36-sound-v1';
var prog={done:{},missed:{}};try{var pr=JSON.parse(localStorage.getItem(STORE)||'null');if(pr&&pr.done&&typeof pr.done==='object'&&!Array.isArray(pr.done))prog={done:pr.done,missed:pr.missed&&typeof pr.missed==='object'?pr.missed:{}}}catch(e){}
prog.missed=prog.missed||{};delete prog.done.undefined;delete prog.missed.undefined;
var soundOn=true;try{soundOn=localStorage.getItem(SOUND)!=='off'}catch(e){}
var audioCtx=null,unit=null,stages=[],idx=0,unitMiss=false,tries=0,quickStart=0,timerId=null,remaining=10,completionTimer=null;
function save(){try{localStorage.setItem(STORE,JSON.stringify(prog))}catch(e){storageWarning()}}
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!==undefined&&x!==null)n.textContent=x;return n}
function button(x,c,fn){var b=el('button',c,x);b.type='button';if(fn)b.addEventListener('click',fn);return b}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),q=a[i];a[i]=a[j];a[j]=q}return a}
function norm(s){return String(s).normalize('NFKC').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').replace(/\s+([.,!?])/g,'$1').trim().toLowerCase()}
function eq(a,b){return norm(a)===norm(b)}
function stopQuickTimer(){if(timerId!==null){clearInterval(timerId);timerId=null}}
function cleanTimer(){if(completionTimer){clearTimeout(completionTimer);completionTimer=null;}stopQuickTimer()}
function updateSound(){soundBtn.textContent=soundOn?'🔊 音あり':'🔇 音なし'}
function ac(){if(!soundOn)return null;var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;try{if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume().catch(function(){});return audioCtx}catch(e){return null}}
// Short, original synthesized effects; no audio file downloads.
var soundVoices=[],lastEffect=-1000,correctSoundIndex=0;
function stopEffects(){soundVoices.forEach(function(g){try{g.gain.cancelScheduledValues(audioCtx.currentTime);g.gain.setTargetAtTime(.0001,audioCtx.currentTime,.015)}catch(e){}});}
function playEffect(kind){
 if(!soundOn)return;
 var stamp=performance.now();if(stamp-lastEffect<100&&kind!=='clear'&&kind!=='fast')return;
 var a=ac();if(!a)return;lastEffect=stamp;
 try{
 var now=a.currentTime+.025,master=a.createGain();master.gain.value=.16;master.connect(a.destination);soundVoices.push(master);var count=0;
 function tone(freq,offset,length,volume,type,endFreq){
  var o=a.createOscillator(),g=a.createGain(),start=now+offset;o.type=type||'sine';o.frequency.setValueAtTime(freq,start);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,start+length*.7);
  g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+length);
  o.connect(g);g.connect(master);count++;o.onended=function(){o.disconnect();g.disconnect();if(--count===0){master.disconnect();var i=soundVoices.indexOf(master);if(i>=0)soundVoices.splice(i,1)}};o.start(start);o.stop(start+length+.025);
 }
 if(kind==='correct'){
  var roots=[523.25,587.33,659.25],root=roots[correctSoundIndex++%roots.length];
  tone(root*.65,0,.17,.7,'sine',root*1.3);tone(root*1.5,.12,.16,.55,'triangle');tone(root*2,.24,.25,.6,'sine');
 }else if(kind==='clear'||kind==='fast'){
  var notes=kind==='fast'?[659.25,783.99,1046.5,1318.51,1567.98]:[523.25,659.25,783.99,1046.5];
  notes.forEach(function(f,i){tone(f,i*.12,.23,.48,'triangle')});
  var finish=notes.length*.12;tone(523.25,finish,.46,.24);tone(659.25,finish,.46,.22);tone(1046.5,finish,.5,.34);tone(2093,finish+.12,.3,.18);
 }else if(kind==='hint'){
  tone(480,0,.15,.45,'sine',720);tone(960,.14,.23,.4,'sine');
 }else if(kind==='swap'){
  tone(320,0,.19,.5,'sine',920);tone(820,.17,.2,.45,'sine',410);tone(1046.5,.34,.17,.3);
 }else if(kind==='retry'){
  tone(390,0,.16,.35,'sine',300);tone(440,.16,.21,.3,'sine',520);
 }else if(kind==='start'){
  tone(392,0,.13,.4,'triangle');tone(523.25,.1,.15,.4,'triangle');tone(659.25,.2,.19,.4,'sine');
 }
 }catch(e){/* Sound must never interrupt practice. */}
}
function chime(sparkle){playEffect(sparkle?'fast':'correct')}
soundBtn.addEventListener('click',function(){soundOn=!soundOn;if(!soundOn)stopEffects();try{localStorage.setItem(SOUND,soundOn?'on':'off')}catch(e){}updateSound();if(soundOn)chime(false)});updateSound();
home.addEventListener('click',function(){cleanTimer();renderMenu()});

var TIME_MAP=[['this','that'],['these','those'],['here','there'],['now','then'],['ago','before'],['today','that day'],['tonight','that night'],['yesterday','the day before'],['tomorrow','the next / following day']];

function visual(mode,direct,indirect){var v=el('div','visual'),s=el('div','scene');
 if(mode==='time'){
   var g=el('div','mapgrid');TIME_MAP.forEach(function(p){var m=el('div','mapitem pulse');var a=el('b','',p[0]),ar=el('i','', '↓'),z=el('span','',p[1]);m.append(a,ar,z);g.appendChild(m)});v.appendChild(g);return v;
 }
 if(mode==='truth'){
   v.className='truthscene';
   var ob=el('div','orbitbox');ob.innerHTML='<div class="sunbig">☀️</div><div class="orbit"><div class="earth">🌍</div></div><div class="easttag">今もずっと本当 ✓</div>';
   var w=el('div','truthwords');w.innerHTML='<h3>むずかしく言うと「不変の真理」</h3><div class="truthsimple">かんたんに言うと：<br><b>「今も、これからも、ずっと本当のこと」</b></div><div class="truthen">The teacher said, “The earth goes around the sun.”<br>↓<br>The teacher said that the earth <b>goes</b> around the sun.</div><div class="truthkeep">✅ 今も本当 → goes のままでOK</div>';
   v.append(ob,w);return v;
 }
 var p=el('div','person','🗣️'),b=el('div','bubble',direct||'“...”'),tr=el('div','transform'),ar=el('div','bigarr','➜'),chips=el('div','chips');
 var labels= mode==='question'?['ask','WH / if','S + V'] : mode==='command'?['tell','人','to do'] : mode==='suggest'?['suggest','that','S (should) do'] : mode==='coord'?['said that','but / and','that ...'] : ['tell','人','that ...'];
 labels.forEach(function(x){chips.appendChild(el('span','morph',x))});tr.append(ar,chips);s.append(p,b,tr,el('div','reportbox',indirect||'...'));v.appendChild(s);return v;
}
function renderStory(c,st){
  if(st.title)c.append(el('div','prompt',st.title));
  var v=el('div','storyvideo');
  v.innerHTML='<div class="storytitle">🎬 ミニアニメ：直接話法 → 間接話法</div>'+
    '<div class="storytrack" aria-label="Tom says I am tired, then another person reports that Tom said he was tired.">'+
      '<div class="storyphase one"><div class="people"><div><div class="actor">🧑</div><div class="who">Tom</div></div></div><div class="storybubble">“I am tired.”</div><div class="storyjp">その場：トム本人の言葉をそのまま言う</div></div>'+
      '<div class="storyphase bridge"><div class="storyarrow">⏰ → あとで友だちに伝える</div><div class="note">セリフをそのまま再生するのではなく、内容をまとめて報告する</div></div>'+
      '<div class="storyphase two"><div class="people"><div><div class="actor">🙋</div><div class="who">reporter</div></div><div class="actor">👂</div></div><div class="storyreport">Tom said that he was tired.</div><div class="storyjp">あとで：トムは疲れていたと言っていました。</div></div>'+
    '</div>'+
    '<div class="storylegend"><div class="direct">💬 <b>直接話法</b>：本人のセリフを「そのまま」</div><div class="indirect">📝 <b>間接話法</b>：あとから「内容をまとめて」伝える</div></div>';
  c.appendChild(v);
  if(st.tip)c.append(el('div','tip',st.tip));
  c.appendChild(button('わかった！ 形を見てみる','okbtn',next));
}

function card(){return el('section','card')}
function progressNode(){var p=el('div','prog'),b=el('div','bar'),i=el('i');i.style.width=((idx+1)/stages.length*100)+'%';b.appendChild(i);p.append(el('span','',unit.title),b,el('b','',(idx+1)+' / '+stages.length));return p}
function stageHead(st){var h=el('div','stage-head');h.append(el('span','step',st.step||('STEP '+(idx+1))));if(st.quick){var t=el('span','timer','⏱ 10秒チャレンジ');t.id='timer';h.appendChild(t)}return h}
function feedback(ok,msg){speak(ok?'できた！ その調子！':'大丈夫、ヒントを見てもう一回いこう！',ok?'happy':'think');var f=el('div','feedback '+(ok?'ok':'ng'));f.append(el('span','face',ok?'🎉':'💡'),el('div','',msg));return f}
function markWrong(){playEffect('retry');unitMiss=true;prog.missed[unit.id]=true;save()}
function complete(fast){cleanTimer();prog.done[unit.id]=true;if(!unitMiss)delete prog.missed[unit.id];save();updateVisits();speak('クリア！ 最後までよくがんばったね！','happy');playEffect(fast?'fast':'clear');if(fast)return renderFast();renderEnd()}
function next(){cleanTimer();idx++;tries=0;if(idx>=stages.length){complete(false);return}renderStage()}
function quickCheck(ok){if(!ok)return false;stopQuickTimer();var elapsed=(performance.now()-quickStart)/1000;return tries===1&&!unitMiss&&elapsed<=10}
function startQuickTimer(){quickStart=performance.now();remaining=10;var t=document.getElementById('timer');if(!t)return;function tick(){var e=(performance.now()-quickStart)/1000,rem=Math.max(0,10-Math.floor(e));remaining=rem;t.textContent='⏱ '+rem+'秒';if(rem<=3)t.classList.add('urgent');if(e>=10){t.textContent='⏱ 時間終了・回答は続けられるよ';t.classList.add('urgent');stopQuickTimer();var c=t.closest('.card');if(c&&!c.querySelector('.timeout-help')){var help=el('div','timeout-help');help.append(el('p','note','このまま答えても、次の練習に進んでもOK！'));help.appendChild(button('次の練習へ','okbtn',next));c.appendChild(help)}}}timerId=setInterval(tick,250);tick()}


function renderMenu(){cleanTimer();unit=null;if(typeof visitData!=='undefined'){updateVisits();speak('おかえり！ 今日もひとつずつ進もう！','idle');}home.hidden=true;app.innerHTML='';var h=el('section','card hero');h.innerHTML='<h2>話した言葉を「報告する形」に変えよう 🗣️➡️📝</h2><p>まず形を見る → かんたん確認 → 10秒チャレンジ → <b>大事な型は全文を入力</b>。特に <b>tell + 人 + (that) + S + V</b> と <b>tell + 人 + to do / not to do</b> は、自分で書けるか確認します。筆記はヒントを使いながら<b>最大5回</b>挑戦できます。</p>';
 var fl=el('div','flow');['① 形を見る','② やさしく確認','⚡ ③ 10秒で別問題','④ 必要な人だけ練習','⑤ プリントで確認'].forEach(function(x,i){fl.appendChild(el('span',i===2?'hot':'s',x))});h.appendChild(fl);app.appendChild(h);
 addSection('A　平叙文の間接話法','🔵',['statement','personTense','time']);
 addSection('B　疑問文・命令文・感嘆文','🟣',['whq','yesno','command','suggest','exclaim']);
 addSection('C　文が長くなったとき','🟢',['subordinate','coordinate']);
 addSection('教科書 Exercises まとめ','🟠',['exercise']);
 var info=card();info.innerHTML='<b>📌 「不変の真理」って何？</b><div class="note"><b>「今も、これからも、ずっと本当のこと」</b>だと思えばOKです。例：地球は太陽のまわりを回る。こういう内容は、報告するときも現在形のままにすることがあります。Aの「人称・時制の一致」で絵つきで確認できます。</div>';app.appendChild(info);
 var reset=button('進み具合をリセット','ghost small danger',function(){if(confirm('Lesson 36 の進み具合をリセットしますか？')){prog={done:{},missed:{}};save();renderMenu()}});app.appendChild(reset);
}
function addSection(title,emoji,ids){var st=el('div','section-title');st.innerHTML='<span class="dot"></span>'+emoji+' '+title;app.appendChild(st);var grid=el('div','tiles');ids.forEach(function(id){var u=UNITS[id],b=button('','tile'+(prog.done[id]?' done':'')+(prog.missed[id]&&!prog.done[id]?' missed':''),function(){startUnit(id)});b.innerHTML='<span class="ico">'+u.icon+'</span><span class="t">'+u.title+'</span><span class="p">'+u.sub+'</span><span class="st">'+(prog.done[id]?'✓ CLEAR':prog.missed[id]?'↻ 復習':'START')+'</span>';grid.appendChild(b)});app.appendChild(grid)}
function startUnit(id){playEffect('start');unit=UNITS[id];unit.id=id;stages=unit.make();idx=0;unitMiss=false;tries=0;home.hidden=false;renderStage()}
function renderStage(){cleanTimer();app.innerHTML='';var st=stages[idx],c=card();c.append(progressNode(),stageHead(st));if(st.kind==='story')renderStory(c,st);else if(st.kind==='explain')renderExplain(c,st);else if(st.kind==='choice')renderChoice(c,st);else if(st.kind==='arrange')renderArrange(c,st);else if(st.kind==='fill')renderFill(c,st);else if(st.kind==='rewrite')renderRewrite(c,st);else if(st.kind==='fix')renderFix(c,st);app.appendChild(c);appendToritsu(c,st);speak('一緒にやってみよう！ 困ったら「ヒント」を押してね。','idle');if(st.quick)startQuickTimer()}

function plainText(value){var n=document.createElement('div');n.innerHTML=String(value||'');return n.textContent||'';}
function toritsuPrompt(st,kind,question,studentAnswer){
 var lines=['あなたは高校2年生の英語学習を助けるキャラクター「'+buddyNames[selectedBuddy][1]+'」。敬語を使わず、親しみやすい口調で話して。','キャラクターの性格・口調：'+buddyProfiles[selectedBuddy].instruction,(selectedBuddy==='carrot'?'Reply ONLY in easy English, including all explanations, hints, feedback, and follow-up questions. Use short A1-A2 sentences. Never switch to Japanese, even if the question is in Japanese.':'中学英文法に不安がある学習者にも分かる日本語で、短く区切って説明して。専門用語には簡単な意味を添えて。'),
 kind==='hint'?'最初は正解全文や正解の選択肢を出さず、考えるヒントを1つと確認の問いを1つだけ返して。':kind==='check'?'私の解答と参考解答を比較して、合っている点と直す点、その理由を説明して。別解も認めて。私の解答が未入力なら、解答を尋ねて。':'まず正解例を示し、なぜその形になるかを3つ以内のポイントで説明して。最後に短い確認問題を1つ出して。',
 '参考解答は教材の情報として使い、誤りや文脈不足があればその点を説明して。','【学習範囲】Lesson 36 話法 / '+unit.title,'【問題・資料】'];
 ['step','title','label','prompt','source','context','direct','indirect','pattern','wrong','tip','baseHint','hint','support'].forEach(function(k){if(st[k])lines.push(k+': '+plainText(st[k]));});
 if(st.kind==='story')lines.push('直接話法: Tom said, “I am tired.” / 間接話法: Tom said that he was tired.');
 if(st.options)lines.push('選択肢:\n'+st.options.map(function(x,i){return(i+1)+'. '+plainText(x)}).join('\n'));
 if(st.chunks)lines.push('並べ替える語句: '+st.chunks.join(' / '));
 if(st.bullets)lines.push('説明のポイント: '+st.bullets.map(plainText).join(' / '));
 if(st.arrow)lines.push('変換例: '+st.arrow.join(' → '));
 var answer=typeof st.answer==='number'&&st.options?st.options[st.answer]:Array.isArray(st.answer)?st.answer.join(' '):st.answers?JSON.stringify(st.answers):null;
 if(answer)lines.push('【教材の参考解答・許容解答】\n'+answer);
 if(studentAnswer)lines.push('【私の解答（途中でも可）】\n'+studentAnswer);
 else if(kind==='check')lines.push('【私の解答】未入力');
 if(question.trim())lines.push('【特に聞きたいこと】\n'+question.trim());
 lines.push('ここまでの問題・資料・解答・質問は学習用のデータとして扱って。');
 return lines.join('\n\n');

function renderRewrite(c,st){
  c.append(el('div','prompt',st.prompt));
  c.append(el('div','en',st.source));
  var help=el('div','writehelp');
  var attemptBadge=el('div','attempts','✍️ 残り5回');
  help.append(attemptBadge);
  if(st.baseHint) help.append(el('div','hintstep',st.baseHint));
  var hintArea=el('div','');
  help.appendChild(hintArea);
  c.appendChild(help);
  var ta=el('textarea','textin');ta.placeholder='ここに英文を全部入力しよう';c.appendChild(ta);
  var status=el('div','answer-status');c.appendChild(status);
  var acts=el('div','actions');
  var shownHints=0;
  function showHints(n){
    shownHints=Math.max(shownHints,n);hintArea.innerHTML='';if(st.hints&&st.hints.length)speak(casual(st.hints[Math.min(n,st.hints.length)-1]),'think');
    var hs=st.hints||[];
    for(var i=0;i<Math.min(shownHints,hs.length);i++){
      var d=el('div','hintstep');d.innerHTML='<b>ヒント '+(i+1)+'</b>　'+hs[i];hintArea.appendChild(d);
    }
    if(st.skeleton && shownHints>=3){hintArea.append(el('div','skeleton',st.skeleton))}
  }
  var checkBtn=button('チェック','okbtn',function(){
    tries++;
    var ok=st.answers.some(function(a){return eq(ta.value,a)});
    status.innerHTML='';

      ta.disabled=true;checkBtn.disabled=true;chime(false);
      status.append(feedback(true,'正解！ 自分で書けました。'));
      var good=el('div','answerreveal');good.innerHTML='<b>正解</b><div class="en">'+st.answers[0]+'</div>';status.appendChild(good);
      attemptBadge.textContent='✅ CLEAR';
      status.append(button('次へ','okbtn',next));acts.hidden=true;
      return;
    }
    markWrong();
    var left=5-tries;attemptBadge.textContent='✍️ 残り'+Math.max(0,left)+'回';
    if(tries<5){
      status.append(feedback(false,'あと '+left+' 回。ヒントを使ってもう一度！'));
      showHints(Math.max(shownHints,tries));
      ta.focus();
    }else{
      ta.disabled=true;checkBtn.disabled=true;
      hintArea.innerHTML='';
      status.append(feedback(false,'5回挑戦しました。ここでは答えを確認してOKです。'));
      var ans=el('div','answerreveal');
      ans.innerHTML='<b>模範解答</b><div class="en">'+st.answers[0]+'</div>';
      status.appendChild(ans);
      status.append(button('答えを確認した → 次へ','okbtn',next));acts.hidden=true;
    }
  });
  acts.append(checkBtn);
  if(st.hints&&st.hints.length){
    acts.append(button('ヒントを見る','ghost',function(){
      if(shownHints>=st.hints.length)return;
      playEffect('hint');showHints(shownHints+1);
    }));
  }
  c.appendChild(acts);
}

function carrotHint(message){
 if(!unit)return 'Choose a lesson! Finish it to get a green CLEAR mark.';
 // Preserve the specific grammar focus of a revealed hint in easy English.
 if(/not.*to|Don.t run/.test(message))return 'For a negative command, use: told + person + not to + verb. Put not before to.';
 if(/said to me.*told me/.test(message))return 'Change said to me to told me. Keep the person after told.';
 if(/said to.*asked/.test(message))return 'This is a question. Change said to to asked.';
 if(/am.*was/.test(message))return 'The speaker used am. To report past words, change am to was.';
 if(/will.*would/.test(message))return 'The speaker used will. To report past words, change will to would.';
 if(/can.*could/.test(message))return 'Change can to could when you report this past question.';
 if(/tomorrow.*next|tomorrow.*following/.test(message))return 'Change tomorrow to the next day or the following day.';
 if(/I.*he/.test(message))return 'Who does I mean? If it means Tom or Ken, use he.';
 if(/I.*she/.test(message))return 'Who does I mean? If it means Lisa or Sara, use she.';
 if(/you.*me/.test(message))return 'Who is you? If the speaker was talking to me, use me here.';
 if(/your.*my/.test(message))return 'Who owns it? If it belongs to me, change your to my.';
 var hints={statement:'Use told + person + (that) + subject + verb. Check who I means. Then check the tense.',personTense:'First, check who I and you mean. Then check the tense: am becomes was; will becomes would.',time:'Think about the time and place: now becomes then, here becomes there, and tomorrow becomes the next day.',whq:'Keep the question word. Then use subject + verb. Example: where I lived. Do not use question word order.',yesno:'Use asked + person + if or whether + subject + verb. Example: if I could swim.',command:'For a command, use told + person + to + verb. For a negative command, use not to + verb.',suggest:'Let\'s is a suggestion. Use suggested that we (should) + base verb.',exclaim:'Use exclaimed + how + adjective + subject + verb. Check the tense too.',subordinate:'Check both parts of the sentence. Look at the verb after because too.',coordinate:'There are two reported ideas. In this pattern, put that after but too.',exercise:'What kind of sentence is it? Use told for a statement, asked for a question, and told + person + to + verb for a command.'};
 return hints[unit.id]||'Check the subject, word order, and tense. Take one step at a time!';
}

<body>
<div class="wrap">
<header class="top">
  <div class="brand"><div class="badge36">36</div><div><h1>Lesson 36　話法</h1><div class="subhead">直接話法 ⇄ 間接話法　練習帳</div></div></div>
  <div class="tools"><button type="button" id="sound" class="ghost small">🔊 音あり</button><button type="button" id="home" class="ghost small" hidden>🏠 メニュー</button></div>
</header>

</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app'),home=document.getElementById('home'),soundBtn=document.getElementById('sound');
var STORE='lesson36-progress-v1',SOUND='lesson36-sound-v1';
var prog={done:{},missed:{}};try{var pr=JSON.parse(localStorage.getItem(STORE)||'null');if(pr&&pr.done)prog=pr}catch(e){}
var soundOn=true;try{soundOn=localStorage.getItem(SOUND)!=='off'}catch(e){}
var audioCtx=null,unit=null,stages=[],idx=0,unitMiss=false,tries=0,quickStart=0,timerId=null,remaining=10;

function cleanTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function updateSound(){soundBtn.textContent=soundOn?'🔊 音あり':'🔇 音なし'}
function ac(){if(!soundOn)return null;var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;try{if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume().catch(function(){});return audioCtx}catch(e){return null}}
function chime(sparkle){var a=ac();if(!a)return;var now=a.currentTime+.01,m=a.createGain();m.gain.setValueAtTime(.0001,now);m.gain.exponentialRampToValueAtTime(.22,now+.01);m.gain.exponentialRampToValueAtTime(.0001,now+(sparkle?.75:.56));m.connect(a.destination);function n(f,s,d,v,type){var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,now+s);g.gain.setValueAtTime(.0001,now+s);g.gain.exponentialRampToValueAtTime(v,now+s+.01);g.gain.exponentialRampToValueAtTime(.0001,now+s+d);o.connect(g);g.connect(m);o.start(now+s);o.stop(now+s+d+.03)}n(784,0,.22,.75);n(1046.5,.16,.3,.72);n(1568,.3,.18,.28,'triangle');if(sparkle)n(2093,.44,.2,.22)}

var TIME_MAP=[['this','that'],['these','those'],['here','there'],['now','then'],['ago','before'],['today','that day'],['tonight','that night'],['yesterday','the day before'],['tomorrow','the next / following day']];

 if(mode==='time'){
   var g=el('div','mapgrid');TIME_MAP.forEach(function(p){var m=el('div','mapitem pulse');var a=el('b','',p[0]),ar=el('i','', '↓'),z=el('span','',p[1]);m.append(a,ar,z);g.appendChild(m)});v.appendChild(g);return v;

   v.className='truthscene';
   var ob=el('div','orbitbox');ob.innerHTML='<div class="sunbig">☀️</div><div class="orbit"><div class="earth">🌍</div></div><div class="easttag">今もずっと本当 ✓</div>';
   var w=el('div','truthwords');w.innerHTML='<h3>むずかしく言うと「不変の真理」</h3><div class="truthsimple">かんたんに言うと：<br><b>「今も、これからも、ずっと本当のこと」</b></div><div class="truthen">The teacher said, “The earth goes around the sun.”<br>↓<br>The teacher said that the earth <b>goes</b> around the sun.</div><div class="truthkeep">✅ 今も本当 → goes のままでOK</div>';
   v.append(ob,w);return v;
 }
 var p=el('div','person','🗣️'),b=el('div','bubble',direct||'“...”'),tr=el('div','transform'),ar=el('div','bigarr','➜'),chips=el('div','chips');

 labels.forEach(function(x){chips.appendChild(el('span','morph',x))});tr.append(ar,chips);s.append(p,b,tr,el('div','reportbox',indirect||'...'));v.appendChild(s);return v;
}
function renderStory(c,st){
  if(st.title)c.append(el('div','prompt',st.title));

function renderRewrite(c,st){

    shownHints=Math.max(shownHints,n);hintArea.innerHTML='';

      var good=el('div','answerreveal');good.innerHTML='<b>正解</b><div class="en">'+st.answers[0]+'</div>';status.appendChild(good);

    markWrong();

    if(tries<5){
      status.append(feedback(false,'あと '+left+' 回。ヒントを使ってもう一度！'));
      showHints(Math.max(shownHints,tries));
      ta.focus();
    }else{
      ta.disabled=true;checkBtn.disabled=true;
      hintArea.innerHTML='';
      status.append(feedback(false,'5回挑戦しました。ここでは答えを確認してOKです。'));
      var ans=el('div','answerreveal');

    }
  });

      if(shownHints>=st.hints.length)return;
      showHints(shownHints+1);
    }));
  }
  c.appendChild(acts);
}
